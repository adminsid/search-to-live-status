# Upptime config for search-to-live.com status page.
# Owned by the production-launch effort (Task #36). Monitors the app and its
# health endpoint; publishes a status page at status.searchtolive.com.

owner: adminsid
repo: search-to-live-status

sites:
  - name: Search to Live
    url: https://searchtolive.com
    slug: main-site
    maxResponseTime: 10000
  - name: API Health
    url: https://searchtolive.com/api/health
    slug: api-health
    maxResponseTime: 10000

status-website:
  cname: status.searchtolive.com
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Search to Live
  introTitle: "**Search to Live** status"
  introMessage: Uptime and incident history for searchtolive.com.
  navbar:
    - title: Status
      href: /
    - title: Search to Live
      href: https://searchtolive.com
